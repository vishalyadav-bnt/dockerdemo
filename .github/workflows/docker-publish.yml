name: Build and Push Docker Image

on:
  push:
    branches:
      - main 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21  
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x dockerDemo/gradlew

      - name: Build with Gradle
        run: |
          cd dockerDemo
          ./gradlew clean build
          
      - name: Ensure JAR file exists
        run: |
         if [ ! -f dockerDemo/build/libs/dockerDemo-0.0.1-SNAPSHOT.jar ]; then
         echo "JAR file not found!"
         exit 1
         else
          echo "JAR file found: dockerDemo/build/libs/dockerDemo-0.0.1-SNAPSHOT.jar"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  
          password: ${{ secrets.DOCKER_PASSWORD }}  
        
      - name: Build Docker image
        run: |
          cd dockerDemo
          docker build -t ${{ secrets.DOCKER_USERNAME }}/bnt-zorrofi-docker-repo:latest .

      - name: Tag Docker image
        run: |
          IMAGE_VERSION=$(date +'%Y%m%d%H%M%S')  
          docker tag ${{ secrets.DOCKER_USERNAME }}/bnt-zorrofi-docker-repo:latest ${{ secrets.DOCKER_USERNAME }}/bnt-zorrofi-docker-repo:$IMAGE_VERSION
          docker push ${{ secrets.DOCKER_USERNAME }}/bnt-zorrofi-docker-repo:$IMAGE_VERSION
          echo "Image tagged as ${{ secrets.DOCKER_USERNAME }}/bnt-zorrofi-docker-repo:$IMAGE_VERSION"

      # - name: Push Docker image
      #   run: |
      #     docker push ${{ secrets.DOCKER_USERNAME }}/bnt-zorrofi-docker-repo:$IMAGE_VERSION

      # - name: Log out from Docker Hub
      #   uses: docker/logout-action@v1
